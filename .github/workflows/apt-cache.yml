# Fills the cache of Ubuntu packages that the browser jobs in ci.yml
# restore before `playwright install --with-deps` (#81). With the cache,
# a slow Ubuntu mirror does not hold up the browser tests.
#
# The fill runs on main because a pull request can read the caches of
# main, but not the caches of another pull request. It runs:
# - on each push to main, so a Playwright update that needs new packages
#   is in the cache for the next pull request;
# - every week, so GitHub does not delete the cache after 7 days without
#   use, and so Ubuntu security updates come into it;
# - by hand (Actions -> System package cache -> Run workflow);
# - on a pull request that changes this file or scripts/apt-debs.sh, to
#   test the change. That cache stays with the pull request: a re-run of
#   its browser jobs uses it, and main does not see it.
#
# The cache key is a hash of the .deb file names (with their versions),
# so a new cache is saved only when the set of packages changes. The
# browser jobs take the newest cache for their browser.
name: System package cache

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/apt-cache.yml
      - scripts/apt-debs.sh
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fill:
    name: Fill the package cache (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # The install can take 25 minutes when the mirror is slow (see ci.yml).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Keep the same list as the e2e-tests job in ci.yml.
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # For the Playwright version in package-lock.json, which sets the
      # list of packages.
      - run: npm ci
      # Start from the current cache, so apt downloads only what changed.
      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-${{ matrix.browser }}-
          restore-keys: apt-debs-${{ matrix.browser }}-
      - run: bash scripts/apt-debs.sh place ~/apt-debs
        timeout-minutes: 5
      - run: npx playwright install-deps ${{ matrix.browser }}
        timeout-minutes: 30
      - id: collect
        run: |
          hash=$(bash scripts/apt-debs.sh collect ~/apt-debs)
          if [ -n "$hash" ]; then
            echo "key=apt-debs-${{ matrix.browser }}-$hash" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the packages (only when they changed)
        if: steps.collect.outputs.key != '' && steps.collect.outputs.key != steps.restore.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.collect.outputs.key }}
