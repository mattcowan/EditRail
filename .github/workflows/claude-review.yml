# Runs a Claude review on a pull request only when the repo owner mentions
# @claude in a PR comment or a review body (for example "@claude review"). Nothing runs on push or when a PR opens, so it uses
# Claude plan usage and Actions minutes only when asked. It is the fallback
# for when the CodeRabbit review is rate limited.
#
# This repository is public: anyone can comment on a PR. The OWNER check
# below is what keeps other people from starting a run on the maintainer's
# plan. Claude reads the PR's text and code, which on a PR from someone else
# can be written to steer it; the read-only token (see the action inputs)
# limits what such text can do to commenting on the PR.
#
# Claude can read the repo and comment on the PR, but it cannot commit or
# push.
#
# GitHub runs issue_comment workflows only from the default branch, and the
# app token exchange rejects a workflow that differs from it. So @claude
# does nothing on the PR that adds or changes this file until it is merged.
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret, created with
# `claude setup-token` (works on Pro and Max), and the Claude GitHub app
# installed on the repo. See docs/releasing.md.
#
# Both actions are pinned to a commit SHA, because a tag such as @v1 can be
# moved and the job holds a token with write access to PRs and issues.
# Dependabot proposes updates (.github/dependabot.yml). Before you merge one
# for claude-code-action, check that the push wrapper below still has the
# same path.
name: Claude review

# No pull_request_review_comment trigger: a review submits its body and each
# inline comment as separate events, so a review that mentions @claude in its
# body and on lines would start more than one run (PR #54 review). One PR
# comment, or one review body, is one event and one run. To ask about a line,
# name the file and line in the PR comment or the review body.
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        github.event.review.author_association == 'OWNER')
    # One run per PR at a time. Two @claude comments posted close together
    # are two events; GitHub keeps one running and only the newest pending,
    # and cancels the rest. Job level, not workflow level, so a comment that
    # skips the job cannot cancel a queued run.
    concurrency:
      group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Credentials stay persisted (the checkout default): the GITHUB_TOKEN
        # here can only read contents, and this matches the setup this
        # workflow was proven with. Test a change to it with a real
        # "@claude review" run.
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read-only. The action swaps the OIDC token for a Claude app token
          # with contents: write by default, and on an open PR it pushes to the
          # PR branch. This lowers the app token to contents: read (merged over
          # the defaults), so a push fails whatever Claude tries.
          additional_permissions: |
            contents: read
          # And stop Claude from trying: block the commit and push tools of both
          # commit paths (git CLI by default, the file-ops tools with commit
          # signing). The action pushes through its own wrapper at
          # $GITHUB_ACTION_PATH/scripts/git-push.sh, which "git push" does not
          # match, so the wrapper gets its own rule; "*" may appear anywhere in
          # a Bash rule, and deny rules win over the action's allow list.
          #
          # Review only. In tag mode the owner's comment is the instruction, so
          # "@claude fix this" would aim Claude at an edit it cannot commit.
          # The appended system prompt makes every run a review. Not `prompt:`:
          # on comment events a prompt switches the action to agent mode and
          # drops the progress comment (src/modes/detector.ts at the pinned
          # SHA). The action splits claude_args with shell-quote, so the text
          # has no dollar signs, backticks or inner double quotes.
          claude_args: >-
            --disallowedTools
            "Bash(git commit:*),Bash(git push:*),Bash(*scripts/git-push.sh*),Bash(git rm:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --append-system-prompt
            "Every request in this run is a request for a code review of this pull request. Read the diff and the files it changes, and check them against CLAUDE.md. Report each finding with its file and line, its severity, and how you verified it. You cannot change code in this run. If the comment asks for a fix, describe the fix or give it as a suggested change, and do not edit files. If the comment asks a question, answer it as part of the review."
